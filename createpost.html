  <body>
    <h1 class="text-success">Authors Page!</h1>
    
    <form class="container" id="addBlog">
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Image URL</label>
    <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" name="image" required>
    <div id="emailHelp" class="form-text">This image show at the top of your blog</div>
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Title</label>
    <input type="text" class="form-control" id="exampleInputPassword1" name="title" required>
  </div>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Content</label>
    <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" name="content" required>
    
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Author</label>
    <input type="text" class="form-control" id="exampleInputPassword1" name="author" required>
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Likes</label>
    <input type="number" class="form-control" id="exampleInputPassword1" name="likes" required>
  </div>
  
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="exampleCheck1" name="isPublished" required>
    <label class="form-check-label" for="exampleCheck1">Published</label>
  </div>
  <button type="submit" class="btn btn-primary">Create Post</button>
</form>

async function createBlog() {
  let formData= {

    likes: addBlog.likes.value,

    isPublished: addBlog.isPublished.checked ? true : false
  }


try {
