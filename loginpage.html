  <body>
    <h1>Log In to your Author Account </h1>

    <form class="container" id="signInForm">
  <div class="mb-3">
    
     <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Email address</label>
    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" name="email">
  
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Password</label>
    <input type="password" class="form-control" id="exampleInputPassword1" name="password">
  </div>

  
  <button type="submit" class="btn btn-primary">Log in</button>
</form>







      </body>
<script type="module">
  // Import the functions you need from the SDKs you need

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth();

 const signInForm = document.getElementById('signInForm')

 signInForm.addEventListener("submit", async (event)=>{
    event.preventDefault();

    let email= await signInForm.email.value;
    let password = signInForm.password.value;


    try {

        const userResponse= await signInWithEmailAndPassword(auth, email, password);
        
        alert("Log in Successfully")
        window.location.href="./createpost.html"
        
        
        
    } catch (error) {
        console.log(error.message);
        if(error.message=="Firebase: Error (auth/invalid-credential)."){
            alert("Invalid Email or Password");
            

        }
    }




 })
  
</script>
