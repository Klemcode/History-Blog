<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HB Sign Up Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <h1>Sign Up </h1>

    <form class="container" id="signUpForm">
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Full Name</label>
    <input type="text" class="form-control" id="exampleInputFullName" aria-describedby="emailHelp" name="fullname">
    
     <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Email address</label>
    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" name="email">
  
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Password</label>
    <input type="password" class="form-control" id="exampleInputPassword1" name="password">
  </div>

   <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Phone Number</label>
    <input type="number" class="form-control" id="exampleInputPhone" name="phone">
  </div>

  
  <button type="submit" class="btn btn-primary">Create Account</button>
</form>







      </body>
<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
   import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyDcudItAwVIumhNwU9wgbBqXpC45fGgp8w",
    authDomain: "klemcode.firebaseapp.com",
    projectId: "klemcode",
    storageBucket: "klemcode.firebasestorage.app",
    messagingSenderId: "59149627541",
    appId: "1:59149627541:web:afb20ac76ad4d08ae02b9c"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db= getFirestore();
  const auth = getAuth();

 const userColRef = collection(db, "users");
 const signUpForm = document.getElementById('signUpForm')

 signUpForm.addEventListener("submit", async (event)=>{
    event.preventDefault();

    let fullname= await signUpForm.fullname.value;
    let email= signUpForm.email.value;
    let phone= signUpForm.phone.value;
    let password = signUpForm.password.value;


    try {

        const userCredential= await createUserWithEmailAndPassword(auth, email, password);
       
        const userSnapShot = await addDoc(userColRef, {
            uid: userCredential.user.uid,
            fullname: fullname,
            email: email,
            phone: phone,
            password: password,
            createAt: serverTimestamp()
        });

        alert('Account Successfully Created')
        window.location.href="./loginpage.html"
        
        
        
    } catch (error) {
        console.log(error.message);

           if(error.message=="Firebase: Error (auth/email-already-in-use)."){
            alert("Email Already Used");
            
      
        
    }

  }


 })
  
</script>




      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</html>
